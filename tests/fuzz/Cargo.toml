# Fuzz targets for procfs2 parsers.
#
# To run fuzzing:
#   1. Install cargo-fuzz:  cargo install cargo-fuzz
#   2. cd tests/fuzz
#   3. cargo fuzz run <target>        e.g. cargo fuzz run fuzz_maps
#
# Targets live in fuzz_targets/ (one file per target). Each target feeds
# arbitrary bytes into a parser and asserts that it never panics.

[package]
name = "procfs2-fuzz"
version = "0.0.0"
edition = "2021"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
procfs2 = { path = "../.." }
libfuzzer-sys = "0.4"

[[bin]]
name = "fuzz_maps"
path = "fuzz_targets/fuzz_maps.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_smaps"
path = "fuzz_targets/fuzz_smaps.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_smaps_rollup"
path = "fuzz_targets/fuzz_smaps_rollup.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_mountinfo"
path = "fuzz_targets/fuzz_mountinfo.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_process_stat"
path = "fuzz_targets/fuzz_process_stat.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_process_status"
path = "fuzz_targets/fuzz_process_status.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_process_limits"
path = "fuzz_targets/fuzz_process_limits.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_process_io"
path = "fuzz_targets/fuzz_process_io.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_cgroup"
path = "fuzz_targets/fuzz_cgroup.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_util_parse"
path = "fuzz_targets/fuzz_util_parse.rs"
test = false
doc = false
bench = false

[profile.release]
debug = true

# Standalone workspace: this crate lives inside the procfs2 workspace
# directory but is not a member, so it must declare its own workspace to
# avoid cargo's "believes it's in a workspace when it's not" error.
[workspace]
