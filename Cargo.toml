[workspace]
members = ["procfs2-macros", "."]

[package]
name = "procfs2"
version = "0.2.0"
authors = ["lucop1911"]
edition = "2024"
rust-version = "1.86"
description = "A modern, zero-copy, strongly-typed Rust library for reading Linux /proc and /sys"
license = "MIT"
repository = "https://github.com/lucop1911/procfs2"
documentation = "https://docs.rs/procfs2"
keywords = ["procfs", "sysfs", "linux", "proc", "system-info"]
categories = ["filesystem", "os", "parsing"]

[dependencies]
bitflags = "2.13.1"
libc = { version = "0.2.189", optional = true }
tokio = { version = "1.53.1", features = ["fs", "net"], optional = true }
serde = { version = "1.0.229", features = ["derive"], optional = true }
procfs2-macros = { path = "./procfs2-macros", version = "0.1.0", optional = true }

[[bench]]
name = "procfs2_bench"
harness = false

[dev-dependencies]
criterion = "0.8.2"
procfs = "0.18.0"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros"] }

[features]
default = []
async = ["dep:tokio"]
watch = ["dep:libc"]
serde = ["dep:serde"]
macros = ["dep:procfs2-macros"]

[[example]]
name = "async"
required-features = ["async"]

[[example]]
name = "macros"
required-features = ["macros"]
