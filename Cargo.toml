[workspace]
members = ["procfs2-macros", "."]

[package]
name = "procfs2"
version = "0.2.1"
authors = ["lucop1911"]
edition = "2024"
rust-version = "1.86"
description = "A modern, zero-copy, strongly-typed Rust library for reading Linux /proc and /sys"
license = "MIT"
repository = "https://github.com/lucop1911/procfs2"
documentation = "https://docs.rs/procfs2"
keywords = ["procfs", "sysfs", "linux", "proc", "system-info"]
categories = ["filesystem", "os", "parsing"]
exclude = [".github/**", ".vscode/**", ".cargo/**", ".gitignore"]

[dependencies]
bitflags = "2.13.2"
libc = { version = "0.2.189", optional = true }
tokio = { version = "1.53.1", features = ["fs", "net", "time"], optional = true }
async-stream = { version = "0.3.6", optional = true }
futures-core = { version = "0.3.34", optional = true }
serde = { version = "1.0.229", features = ["derive"], optional = true }
procfs2-macros = { path = "./procfs2-macros", version = "0.1.0", optional = true }
memchr = "2.8.3"

[[bench]]
name = "procfs2_bench"
harness = false

[dev-dependencies]
criterion = "0.8.2"
futures-util = "0.3.34"
procfs = "0.18.0"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros"] }


[features]
default = []
async = ["dep:tokio", "dep:async-stream", "dep:futures-core"]
watch = ["dep:libc"]
serde = ["dep:serde"]
macros = ["dep:procfs2-macros"]

[[example]]
name = "async"
required-features = ["async"]

[[example]]
name = "async_watch"
required-features = ["async"]

[[example]]
name = "watch"
required-features = ["watch"]

[[example]]
name = "macros"
required-features = ["macros"]
